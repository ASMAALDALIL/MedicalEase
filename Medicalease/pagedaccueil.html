                transform: translateY(-20px) rotate(10deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);

<body>
    <div class="floating-icons">

">MEDICAL EASE </h1>
    <p class="paragraphe">مرحبًا بكم في تطبيق "MedicalEase". <br>يهدف هذا التطبيق إلى تحسين تجربتكم في إدارة سجلاتكم
        الصحية الشخصية.<br> من خلال واجهة سهلة الاستخدام، يمكنكم الآن حجز مواعيد اللقاحات، تسجيل الوصفات الطبية، ومتابعة
        جميع بياناتكم الصحية بكل سهولة وأمان.<br> نحن هنا لنسهل عليكم الوصول إلى رعاية صحية أفضل.

        <img src="images/pauseaudio.jpg" id="stylebtn" alt="play/pause button">
        <audio id="styleAudio">
            <source src="audio/introduction.mp3" type="audio/mp3">
        </audio>
        <video width="640" height="360" controls>
            <source src="audio/videoexplicatif.mp4" type="video/mp4">
        </video>
    <div class="header">
        <button class="login-button" onclick="window.location.href='login.php'">تسجيل </button>
    </div>
    <script>
        var music = document.getElementById("styleAudio")
        var button = document.getElementById("stylebtn")
        button.onclick = function () {
            if (music.paused) {
                music.play();
                button.src = "images/playaudio.jpg"
            } else {
                music.pause();
                button.src = "images/pauseaudio.jpg"
            }
        }
        music.onended = function () {
            button.src = "images/pauseaudio.jpg";
        };
    </script>
</body>
